<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>skelgraph — interactive pipeline viewer</title>
<style>
  :root {
    --bg: #0e1116; --panel: #171b22; --panel2: #1e242d; --line: #2a323d;
    --fg: #d7dee7; --muted: #8b97a6; --accent: #4da3ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--fg); }
  #app { display: grid; grid-template-columns: 320px 1fr; height: 100%; }
  #sidebar { background: var(--panel); border-right: 1px solid var(--line);
    overflow-y: auto; padding: 12px 14px 40px; }
  #main { position: relative; }
  canvas { display: block; }
  h1 { font-size: 15px; margin: 2px 0 2px; letter-spacing: .3px; }
  .sub { color: var(--muted); font-size: 11px; margin-bottom: 12px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .8px;
    color: var(--muted); margin: 18px 0 8px; border-bottom: 1px solid var(--line);
    padding-bottom: 4px; }
  label.row { display: grid; grid-template-columns: 1fr 66px; gap: 8px;
    align-items: center; margin: 7px 0; }
  label.row > span { color: var(--fg); }
  input[type=range] { width: 100%; }
  select, input[type=number] { width: 100%; background: var(--panel2);
    color: var(--fg); border: 1px solid var(--line); border-radius: 5px;
    padding: 4px 6px; font: inherit; }
  .val { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .group { margin-bottom: 6px; }
  .toggles label { display: flex; align-items: center; gap: 7px; margin: 5px 0;
    cursor: pointer; }
  .sw { width: 11px; height: 11px; border-radius: 3px; flex: none; }
  button { background: var(--accent); color: #04121f; border: 0; border-radius: 6px;
    padding: 8px 10px; font: inherit; font-weight: 600; cursor: pointer; width: 100%; }
  button.ghost { background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    font-weight: 500; }
  .btnrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  /* stage stepper */
  #stepper { position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; background: rgba(23,27,34,.9); padding: 6px;
    border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(6px);
    max-width: 92%; flex-wrap: wrap; justify-content: center; }
  .step { padding: 5px 10px; border-radius: 7px; cursor: pointer; color: var(--muted);
    white-space: nowrap; font-size: 12px; border: 1px solid transparent; }
  .step.active { background: var(--accent); color: #04121f; font-weight: 600; }
  .step:hover:not(.active) { color: var(--fg); border-color: var(--line); }
  /* info panel */
  #info { position: absolute; bottom: 12px; left: 12px; max-width: 46%;
    background: rgba(23,27,34,.9); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; backdrop-filter: blur(6px); }
  #summary { font-weight: 600; }
  #notes { color: var(--muted); margin-top: 4px; font-size: 12px; white-space: pre-line; }
  #legend { position: absolute; bottom: 12px; right: 12px;
    background: rgba(23,27,34,.9); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; backdrop-filter: blur(6px); font-size: 12px; }
  #legend div { display: flex; align-items: center; gap: 7px; margin: 3px 0; }
  #anim { display: none; margin-top: 6px; }
  #status { position: absolute; top: 12px; right: 12px; color: var(--muted);
    font-size: 12px; background: rgba(23,27,34,.85); padding: 4px 10px;
    border-radius: 8px; border: 1px solid var(--line); }
  .err { color: #ff6b6b; }
  a { color: var(--accent); }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <h1>skelgraph</h1>
    <div class="sub">Point cloud → branch points &amp; segments.<br>Every stage is the real pipeline.</div>

    <h2>Dataset</h2>
    <select id="dataset"></select>
    <div id="gen-params" style="margin-top:8px"></div>

    <h2>Pipeline config</h2>
    <div id="config-params"></div>
    <label class="row" style="margin-top:8px">
      <span>Animate contraction</span>
      <input type="checkbox" id="animate" style="justify-self:end;width:auto">
    </label>

    <div class="btnrow">
      <button id="run">Run ▸</button>
      <button id="reseed" class="ghost">Reseed ⟳</button>
    </div>
    <label class="row" style="margin-top:10px">
      <span>Auto-run on change</span>
      <input type="checkbox" id="autorun" checked style="justify-self:end;width:auto">
    </label>

    <h2>Layers</h2>
    <div class="toggles" id="layers"></div>

    <h2>Pulse simulation</h2>
    <div class="toggles">
      <label><input type="checkbox" id="pulse-on"><span class="sw" style="background:#66ccff"></span>Enable pulses</label>
      <label><input type="checkbox" id="pulse-lights" checked>Show light sources</label>
      <label><input type="checkbox" id="pulse-rand" checked>Randomize colours</label>
    </div>
    <label class="row"><span>Base colour</span><input type="color" id="pulse-color" value="#66ccff" style="justify-self:end;width:40px;height:22px;padding:0"></label>
    <label class="row"><span>Speed</span><span class="val" id="pulse-speed-v">3</span></label>
    <input type="range" id="pulse-speed" min="0.2" max="20" step="0.2" value="3">
    <label class="row"><span>Spawn rate /s</span><span class="val" id="pulse-spawn-v">0.8</span></label>
    <input type="range" id="pulse-spawn" min="0" max="5" step="0.1" value="0.8">
    <label class="row"><span>Clone prob</span><span class="val" id="pulse-clone-v">0.35</span></label>
    <input type="range" id="pulse-clone" min="0" max="1" step="0.05" value="0.35">
    <label class="row"><span>Reflect prob</span><span class="val" id="pulse-reflect-v">0.5</span></label>
    <input type="range" id="pulse-reflect" min="0" max="1" step="0.05" value="0.5">
    <label class="row"><span>Brightness</span><span class="val" id="pulse-intensity-v">1</span></label>
    <input type="range" id="pulse-intensity" min="0.1" max="4" step="0.1" value="1">
    <label class="row"><span>Glow radius</span><span class="val" id="pulse-falloff-v">0.6</span></label>
    <input type="range" id="pulse-falloff" min="0.05" max="3" step="0.05" value="0.6">
    <label class="row"><span>Max agents</span><span class="val" id="pulse-max-v">40</span></label>
    <input type="range" id="pulse-max" min="1" max="120" step="1" value="40">

    <div id="anim">
      <h2>Contraction</h2>
      <label class="row"><span>Frame</span><span class="val" id="frameval">0</span></label>
      <input type="range" id="frame" min="0" max="0" value="0" step="1">
      <button id="play" class="ghost" style="margin-top:6px">▶ Play</button>
    </div>
  </aside>

  <div id="main">
    <div id="stepper"></div>
    <div id="status">loading…</div>
    <div id="info"><div id="summary"></div><div id="notes"></div></div>
    <div id="legend"></div>
  </div>
</div>

<!-- Three.js is vendored locally (viz/static/vendor/) so the viewer has no
     runtime CDN dependency and works offline / on locked-down networks. -->
<script type="importmap">
{ "imports": {
  "three": "/static/vendor/three.module.js",
  "three/addons/controls/OrbitControls.js": "/static/vendor/OrbitControls.js"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------------------------------------------------------------- palette
const COL = {
  curve: 0x8b98a8, surface: 0xd0a962, contracted: 0x59c1ff,
  edge: 0x50606f, skelNode: 0x8fb2d6, merged: 0xff3a63,
  tip: 0x35db8a, interior: 0x5b86d6, branch: 0xff4d4d, isolated: 0x9aa6b3,
  truth: 0x39f2a0, shortcut: 0xff9f45,
};
const SEG_HUES = [0.0, 0.58, 0.12, 0.75, 0.34, 0.88, 0.46, 0.66, 0.20, 0.94];

// ---------------------------------------------------------------- pulse state
// Declared before the render loop (which reads it on its first synchronous
// frame) so it isn't in a temporal dead zone. All fields are live-tunable from
// the sidebar; the simulation runs entirely client-side off the topology.
const pulse = {
  on: false, showLights: true, randomize: true, color: 0x66ccff,
  speed: 3, spawnRate: 0.8, cloneProb: 0.35, reflectProb: 0.5,
  intensity: 1, falloff: 0.6, maxAgents: 40,
  model: null, agents: [], inputObj: null, inputCoords: null, baseColors: null,
  lightObj: null, _last: 0,
};
const LIGHT_CAP = 256;   // max light-source markers (declared before pulseInitLights runs)

// ---------------------------------------------------------------- three.js
const main = document.getElementById('main');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
main.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1116);
const camera = new THREE.PerspectiveCamera(50, 1, 0.01, 5000);
camera.position.set(6, 6, 12);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.AmbientLight(0xffffff, 0.75));
const dir = new THREE.DirectionalLight(0xffffff, 0.7); dir.position.set(4, 8, 6);
scene.add(dir);
const grid = new THREE.GridHelper(40, 40, 0x223, 0x1a2029);
grid.material.opacity = 0.35; grid.material.transparent = true; scene.add(grid);
pulseInitLights();

function resize() {
  const w = main.clientWidth, h = main.clientHeight;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
// Declared before the render loop: `let` bindings are in a temporal dead zone
// until their declaration runs, and the loop's first (synchronous) frame reads
// `playing` — referencing it here from its later declaration site would throw
// and abort the whole module before boot().
let playing = false, playT = 0;
(function loop(now){ requestAnimationFrame(loop); controls.update();
  if (playing) tickAnim();
  if (pulse.on && pulse.model) {
    let dt = pulse._last ? (now - pulse._last) / 1000 : 0;
    pulse._last = now;
    pulseStep(Math.min(dt, 0.05));   // clamp long frames (tab switch) so agents don't jump
    pulseIlluminate();
  } else { pulse._last = 0; }
  renderer.render(scene, camera); })();

// ---------------------------------------------------------------- geometry helpers
const root = new THREE.Group(); scene.add(root);
let sceneScale = 1;

function disposeGroup(g){ g.traverse(o=>{ o.geometry?.dispose(); o.material?.dispose?.(); }); }
function clearRoot(){ disposeGroup(root); root.clear(); }

function pointsObj(coords, color, sizeMul=1, perVertexColors=null){
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(coords.length*3);
  coords.forEach((p,i)=>{ pos[i*3]=p[0]; pos[i*3+1]=p[1]; pos[i*3+2]=p[2]; });
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const mat = new THREE.PointsMaterial({ size: sceneScale*0.02*sizeMul,
    sizeAttenuation:true, color: color??0xffffff });
  if (perVertexColors){
    const c = new Float32Array(coords.length*3); const tmp = new THREE.Color();
    perVertexColors.forEach((hex,i)=>{ tmp.set(hex); c[i*3]=tmp.r;c[i*3+1]=tmp.g;c[i*3+2]=tmp.b; });
    g.setAttribute('color', new THREE.BufferAttribute(c,3));
    mat.vertexColors = true; mat.color.set(0xffffff);
  }
  return new THREE.Points(g, mat);
}

function segmentsObj(coords, edges, color, opacity=1, width=1){
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(edges.length*6);
  edges.forEach((e,i)=>{ const a=coords[e[0]], b=coords[e[1]];
    pos[i*6]=a[0];pos[i*6+1]=a[1];pos[i*6+2]=a[2];
    pos[i*6+3]=b[0];pos[i*6+4]=b[1];pos[i*6+5]=b[2]; });
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const mat = new THREE.LineBasicMaterial({ color, transparent: opacity<1, opacity });
  return new THREE.LineSegments(g, mat);
}

function polylineObj(pts, color, closed=false, dashed=false){
  const arr = pts.slice();
  if (closed && arr.length>1){ const a=arr[0], b=arr[arr.length-1];
    if (a[0]!==b[0]||a[1]!==b[1]||a[2]!==b[2]) arr.push(a); }
  const g = new THREE.BufferGeometry().setFromPoints(arr.map(p=>new THREE.Vector3(p[0],p[1],p[2])));
  let mat;
  if (dashed){ mat = new THREE.LineDashedMaterial({ color, dashSize: sceneScale*0.12,
    gapSize: sceneScale*0.08, transparent:true, opacity:0.9 }); }
  else mat = new THREE.LineBasicMaterial({ color, linewidth:2 });
  const line = new THREE.Line(g, mat);
  if (dashed) line.computeLineDistances();
  return line;
}

function sphere(p, color, r){
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12),
    new THREE.MeshLambertMaterial({ color }));
  m.position.set(p[0],p[1],p[2]); return m;
}

// ---------------------------------------------------------------- pulse simulation
// Agent-based "pulses" (virtual light sources) that travel along the skeleton
// segments and illuminate the input cloud with an r^2 (softened) falloff. Each
// agent: spawns at a tip, moves at finite speed, at a branch point picks a
// segment to continue on (and may clone onto the others), and at a tip reflects
// or destructs. Runs entirely off `Topology` (segments = ordered node chains).
function pulseInitLights(){
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(LIGHT_CAP*3), 3));
  g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(LIGHT_CAP*3), 3));
  g.setDrawRange(0, 0);
  const m = new THREE.PointsMaterial({ size: 0.12, vertexColors: true,
    sizeAttenuation: true, transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending });
  pulse.lightObj = new THREE.Points(g, m);
  pulse.lightObj.frustumCulled = false;
  pulse.lightObj.visible = false;
  scene.add(pulse.lightObj);
}

// Build the navigable skeleton: per segment an ordered polyline with cumulative
// arclength, and per node the incident segment-ends (for branching at junctions).
function pulseBuildModel(res){
  const coords = res.stages.topology.coords;
  const segs = [];
  res.stages.topology.segments.forEach(s => {
    if (s.points.length < 2) return;
    const pts = s.points.map(i => coords[i]);
    const cum = [0];
    for (let k=1;k<pts.length;k++){
      const a=pts[k-1], b=pts[k];
      cum.push(cum[k-1] + Math.hypot(b[0]-a[0], b[1]-a[1], b[2]-a[2]));
    }
    segs.push({ id: segs.length, nodeIds: s.points, pts, cum,
                total: cum[cum.length-1], closed: !!s.closed });
  });
  const inc = new Map();  // node id -> [{seg, end}]  (end 0 = arclength 0, 1 = total)
  const add = (node, seg, end) => { (inc.get(node) || inc.set(node, []).get(node)).push({seg, end}); };
  segs.forEach(seg => {
    if (seg.closed) return;                       // loops have no endpoints
    add(seg.nodeIds[0], seg.id, 0);
    add(seg.nodeIds[seg.nodeIds.length-1], seg.id, 1);
  });
  const tips = [];                                // degree-1 nodes: spawn/reflect
  inc.forEach(list => { if (list.length === 1) tips.push(list[0]); });
  return { segs, inc, tips };
}

// Distance an agent runs on/off the tube end while fading in/out. A few glow
// radii, so by the far end of the runway the r^2 falloff has faded it out.
function pulseRunway(){ return pulse.falloff * 3; }

// World position at arclength `s`. Beyond a segment's ends (s<0 or s>total) it
// *extrapolates* along the end edge, so a spawning/despawning agent runs onto/
// off the tube end and its illumination fades smoothly instead of popping.
function pulseWorldPos(seg, s){
  const pts = seg.pts;
  if (!seg.closed && s < 0){
    const a = pts[0], b = pts[1];
    const L = Math.hypot(b[0]-a[0], b[1]-a[1], b[2]-a[2]) || 1e-9, u = s / L;
    return [a[0]+(b[0]-a[0])*u, a[1]+(b[1]-a[1])*u, a[2]+(b[2]-a[2])*u];
  }
  if (!seg.closed && s > seg.total){
    const n = pts.length, a = pts[n-2], b = pts[n-1];
    const L = Math.hypot(b[0]-a[0], b[1]-a[1], b[2]-a[2]) || 1e-9, u = (s - seg.total) / L;
    return [b[0]+(b[0]-a[0])*u, b[1]+(b[1]-a[1])*u, b[2]+(b[2]-a[2])*u];
  }
  const t = seg.closed ? ((s % seg.total) + seg.total) % seg.total : s;
  const cum = seg.cum;
  let k = 1; while (k < cum.length-1 && cum[k] < t) k++;
  const a = pts[k-1], b = pts[k];
  const f = (t - cum[k-1]) / ((cum[k]-cum[k-1]) || 1e-9);
  return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f];
}

function pulseNewColor(inherit){
  if (!pulse.randomize && inherit) return inherit;
  if (pulse.randomize){ const c = new THREE.Color().setHSL(Math.random(), 0.85, 0.6); return [c.r,c.g,c.b]; }
  const c = new THREE.Color(pulse.color); return [c.r,c.g,c.b];
}

function pulseSpawn(){
  const m = pulse.model;
  if (!m || !m.tips.length || pulse.agents.length >= pulse.maxAgents) return;
  const tip = m.tips[(Math.random()*m.tips.length)|0];
  const seg = m.segs[tip.seg];
  const rw = pulseRunway();               // start off the tube end and run in ('enter')
  pulse.agents.push({ seg: seg.id, pos: tip.end===0 ? -rw : seg.total + rw,
                      dir: tip.end===0 ? 1 : -1, col: pulseNewColor(), phase: 'enter' });
}

// Enter segment `o` (an {seg,end}) having overshot a node by `ov`. On-tube ('live').
function pulseEnter(o, ov, col){
  const cs = pulse.model.segs[o.seg];
  return { seg: o.seg, pos: o.end===0 ? ov : cs.total - ov,
           dir: o.end===0 ? 1 : -1, col, phase: 'live' };
}

function pulseStep(dt){
  const m = pulse.model; if (!m) return;
  const rw = pulseRunway();
  if (Math.random() < pulse.spawnRate * dt) pulseSpawn();
  const next = [];
  for (const ag of pulse.agents){
    const seg = m.segs[ag.seg];
    ag.pos += ag.dir * pulse.speed * dt;
    if (seg.closed){ ag.pos = ((ag.pos % seg.total)+seg.total)%seg.total; next.push(ag); continue; }

    // Running onto the tube from the runway: fade in until it reaches the tube.
    if (ag.phase === 'enter'){
      if (ag.pos >= 0 && ag.pos <= seg.total) ag.phase = 'live';
      next.push(ag); continue;
    }
    // Running off the tube end: keep going until past the runway, then despawn.
    if (ag.phase === 'exit'){
      if (ag.pos > -rw && ag.pos < seg.total + rw) next.push(ag);
      continue;
    }
    // 'live' (on the tube)
    if (ag.pos >= 0 && ag.pos <= seg.total){ next.push(ag); continue; }
    // arrived at a node
    const atEnd = ag.pos > seg.total;
    const overshoot = atEnd ? ag.pos - seg.total : -ag.pos;
    const node = seg.nodeIds[atEnd ? seg.nodeIds.length-1 : 0];
    const opts = (m.inc.get(node) || []).filter(e => !(e.seg===ag.seg && e.end===(atEnd?1:0)));
    if (opts.length === 0){                       // tip: reflect, or run off the end and fade out
      if (Math.random() < pulse.reflectProb){
        ag.dir *= -1;
        ag.pos = atEnd ? seg.total - overshoot : overshoot;
        next.push(ag);
      } else {
        ag.phase = 'exit';                        // keep moving outward into the runway
        next.push(ag);
      }
      continue;
    }
    // branch: continue down one, maybe clone onto the others
    const pick = opts[(Math.random()*opts.length)|0];
    const cont = pulseEnter(pick, overshoot, ag.col);
    ag.seg = cont.seg; ag.pos = cont.pos; ag.dir = cont.dir; ag.phase = 'live';
    next.push(ag);
    for (const o of opts){
      if (o === pick) continue;
      if (next.length < pulse.maxAgents && Math.random() < pulse.cloneProb)
        next.push(pulseEnter(o, overshoot, pulseNewColor(ag.col)));
    }
  }
  pulse.agents = next.length > pulse.maxAgents ? next.slice(0, pulse.maxAgents) : next;
}

function pulseIlluminate(){
  const obj = pulse.inputObj, coords = pulse.inputCoords, m = pulse.model;
  if (!obj || !coords || !m) return;
  const col = obj.geometry.getAttribute('color'), base = pulse.baseColors;
  const soft = pulse.falloff * pulse.falloff, dim = 0.10, cap = pulse.intensity;
  // world positions + colours of active agents
  const A = pulse.agents.map(a => ({ p: pulseWorldPos(m.segs[a.seg], a.pos), c: a.col }));
  const n = coords.length;
  for (let i=0;i<n;i++){
    const px=coords[i][0], py=coords[i][1], pz=coords[i][2];
    let r = base[i*3]*dim, g = base[i*3+1]*dim, b = base[i*3+2]*dim;
    for (let j=0;j<A.length;j++){
      const a=A[j], dx=px-a.p[0], dy=py-a.p[1], dz=pz-a.p[2];
      const inten = cap * soft / (dx*dx+dy*dy+dz*dz + soft);   // softened r^2 falloff
      r += a.c[0]*inten; g += a.c[1]*inten; b += a.c[2]*inten;
    }
    col.setXYZ(i, r<1?r:1, g<1?g:1, b<1?b:1);
  }
  col.needsUpdate = true;
  // light-source markers
  const lg = pulse.lightObj, lp = lg.geometry.getAttribute('position'), lc = lg.geometry.getAttribute('color');
  const count = Math.min(A.length, LIGHT_CAP);
  for (let j=0;j<count;j++){ lp.setXYZ(j, A[j].p[0], A[j].p[1], A[j].p[2]);
    lc.setXYZ(j, A[j].c[0], A[j].c[1], A[j].c[2]); }
  lp.needsUpdate = true; lc.needsUpdate = true;
  lg.geometry.setDrawRange(0, count);
  lg.material.size = sceneScale * 0.05;
  lg.visible = pulse.showLights;
}

function pulseRestoreColors(){
  const obj = pulse.inputObj; if (!obj || !pulse.baseColors) return;
  const col = obj.geometry.getAttribute('color');
  col.array.set(pulse.baseColors); col.needsUpdate = true;
}

// Called when the pulse toggle changes or a new pipeline result arrives.
function pulseSync(){
  if (pulse.on){
    if (!pulse.model && lastResult) pulse.model = pulseBuildModel(lastResult);
    setLayer('input', true); applyVisibility();
    if (!pulse.agents.length) for (let i=0;i<3;i++) pulseSpawn();
  } else {
    pulse.agents = []; pulseRestoreColors();
    if (pulse.lightObj) pulse.lightObj.visible = false;
  }
}

function fit(coords){
  const box = new THREE.Box3();
  coords.forEach(p=>box.expandByPoint(new THREE.Vector3(p[0],p[1],p[2])));
  if (box.isEmpty()) return;
  const c = box.getCenter(new THREE.Vector3());
  const s = box.getSize(new THREE.Vector3());
  sceneScale = Math.max(s.x,s.y,s.z,1);
  controls.target.copy(c);
  camera.position.set(c.x + sceneScale*1.1, c.y + sceneScale*0.9, c.z + sceneScale*1.8);
  camera.near = sceneScale/500; camera.far = sceneScale*500; camera.updateProjectionMatrix();
  grid.position.set(c.x, box.min.y, c.z);
  grid.scale.setScalar(sceneScale/8);
}

// ---------------------------------------------------------------- layers
const LAYER_DEFS = [
  ['input',       'Input cloud',            COL.curve],
  ['truth',       'Ground truth',           COL.truth],
  ['contraction', 'Contraction',            COL.contracted],
  ['adjacency',   'Adjacency graph',        COL.edge],
  ['shortcuts',   'Pruned shortcuts',       COL.shortcut],
  ['skeleton',    'Skeleton (collapse)',    COL.skelNode],
  ['merged',      'Consolidated junctions', COL.merged],
  ['degrees',     'Degree classes',         COL.branch],
  ['branch',      'Branch points',          COL.branch],
  ['segments',    'Segments',               0xffffff],
];
const layerGroups = {};       // name -> THREE.Group
const layerVisible = {};      // name -> bool
LAYER_DEFS.forEach(([n])=>{ const g = new THREE.Group(); layerGroups[n]=g; root.add(g); });

const layersEl = document.getElementById('layers');
LAYER_DEFS.forEach(([name,label,color])=>{
  const l = document.createElement('label');
  const sw = document.createElement('span'); sw.className='sw';
  sw.style.background = '#'+color.toString(16).padStart(6,'0');
  const cb = document.createElement('input'); cb.type='checkbox'; cb.dataset.layer=name;
  cb.addEventListener('change',()=>{ layerVisible[name]=cb.checked; applyVisibility(); });
  l.append(cb, sw, document.createTextNode(label));
  layersEl.appendChild(l);
});
function setLayer(name,on){ layerVisible[name]=on;
  const cb = layersEl.querySelector(`[data-layer="${name}"]`); if(cb) cb.checked=on; }
function applyVisibility(){ for(const [n,g] of Object.entries(layerGroups)) g.visible=!!layerVisible[n]; }

// ---------------------------------------------------------------- rebuild scene from a result
let lastResult = null;
let animFrames = null, animAttr = null;

function rebuild(res){
  lastResult = res;
  clearRoot();
  LAYER_DEFS.forEach(([n])=>{ const g=new THREE.Group(); layerGroups[n]=g; root.add(g); });
  const S = res.stages;
  const input = S.input.points;
  fit(input);

  // input cloud coloured by curve/surface label
  const labels = res.meta.labels || [];
  const cols = input.map((_,i)=> labels[i] ? COL.surface : COL.curve);
  const inputObj = pointsObj(input, null, 1.0, cols);
  layerGroups.input.add(inputObj);

  // pulse simulation: keep a handle on the input cloud + its base colours, and
  // rebuild the navigable skeleton model from this result.
  pulse.inputObj = inputObj;
  pulse.inputCoords = input;
  pulse.baseColors = Float32Array.from(inputObj.geometry.getAttribute('color').array);
  pulse.model = pulseBuildModel(res);
  pulse.agents = [];
  if (pulse.on) pulseSync();

  // ground truth
  (res.meta.truth.polylines||[]).forEach(pl=>{
    if(pl.length>1) layerGroups.truth.add(polylineObj(pl, COL.truth, false, true)); });
  (res.meta.truth.branch_points||[]).forEach(p=> layerGroups.truth.add(sphere(p, COL.truth, sceneScale*0.02)));

  // reduce stage
  const rd = S.reduce;
  animFrames = null; document.getElementById('anim').style.display='none';
  if (rd.mode === 'collapse'){
    layerGroups.adjacency.add(segmentsObj(rd.contracted, rd.contraction_graph_edges, COL.edge, 0.5));
    const cpts = pointsObj(rd.contracted, COL.contracted, 1.1);
    layerGroups.contraction.add(cpts);
    // skeleton nodes + edges
    layerGroups.skeleton.add(segmentsObj(rd.skeleton_points, rd.skeleton_edges, COL.skelNode, 0.9));
    layerGroups.skeleton.add(pointsObj(rd.skeleton_points, COL.skelNode, 1.3));
    // shortcut edges pruned from the junction blob
    if (rd.pruned_edges && rd.pruned_edges.length)
      layerGroups.shortcuts.add(segmentsObj(rd.skeleton_points, rd.pruned_edges, COL.shortcut, 1.0));
    if (rd.contraction_frames){
      animFrames = rd.contraction_frames; animAttr = cpts.geometry.getAttribute('position');
      const fr = document.getElementById('frame');
      fr.max = animFrames.length-1; fr.value = animFrames.length-1;
      document.getElementById('frameval').textContent = fr.value;
      document.getElementById('anim').style.display='block';
      setFrame(animFrames.length-1);
    }
  } else {
    layerGroups.adjacency.add(segmentsObj(rd.reduced_points, rd.adjacency_edges, COL.edge, 0.85));
    layerGroups.skeleton.add(pointsObj(rd.reduced_points, COL.skelNode, 1.0));
    // shortcut edges removed by the relative-neighbourhood filter
    if (rd.pruned_edges && rd.pruned_edges.length)
      layerGroups.shortcuts.add(segmentsObj(rd.reduced_points, rd.pruned_edges, COL.shortcut, 1.0));
  }

  // consolidation highlight
  if (S.consolidate && S.consolidate.merged_edges.length){
    layerGroups.merged.add(segmentsObj(S.consolidate.before_points, S.consolidate.merged_edges, COL.merged, 1.0));
    S.consolidate.merged_edges.forEach(e=>{
      layerGroups.merged.add(sphere(S.consolidate.before_points[e[0]], COL.merged, sceneScale*0.018));
      layerGroups.merged.add(sphere(S.consolidate.before_points[e[1]], COL.merged, sceneScale*0.018));
    });
  }

  // topology: degrees, branch points, segments
  const T = S.topology;
  const kindCol = { tip:COL.tip, interior:COL.interior, branch:COL.branch, isolated:COL.isolated };
  const nodeIds = Object.keys(T.degree).map(Number).sort((a,b)=>a-b);
  const degCoords = nodeIds.map(i=>T.coords[i]);
  const degCols = T.kinds; // aligned to graph.nodes() order == nodeIds order
  layerGroups.degrees.add(pointsObj(degCoords, null, 1.5, degCols.map(k=>kindCol[k])));
  // tips as little markers too
  T.tips.forEach(i=> layerGroups.degrees.add(sphere(T.coords[i], COL.tip, sceneScale*0.012)));

  T.branch_points.forEach(p=> layerGroups.branch.add(sphere(p, COL.branch, sceneScale*0.028)));

  T.segments.forEach((s,i)=>{
    if (s.points.length < 2){ // isolated point
      layerGroups.segments.add(sphere(T.coords[s.points[0]], COL.isolated, sceneScale*0.02)); return;
    }
    const col = new THREE.Color().setHSL(SEG_HUES[i%SEG_HUES.length], 0.7, 0.6).getHex();
    const pts = s.points.map(idx=>T.coords[idx]);
    layerGroups.segments.add(polylineObj(pts, col, s.closed, false));
    // thicken with a faint point trail so thin lines are visible
    layerGroups.segments.add(pointsObj(pts, col, 0.9));
  });

  // info + legend
  document.getElementById('summary').textContent = S.summary;
  const notes = (S.notes||[]).join('\n');
  document.getElementById('notes').textContent =
    `effective mode: ${S.effective_mode}\n` + notes;
  buildLegend(S);
  buildStepper(S);
  applyVisibility();
}

// contraction animation (`playing`/`playT` declared above, before the loop)
function setFrame(k){
  if(!animFrames || !animAttr) return;
  const f = animFrames[k];
  for(let i=0;i<f.length;i++){ animAttr.setXYZ(i, f[i][0], f[i][1], f[i][2]); }
  animAttr.needsUpdate = true;
  document.getElementById('frameval').textContent = k;
  document.getElementById('frame').value = k;
}
document.getElementById('frame').addEventListener('input', e=> setFrame(+e.target.value));
document.getElementById('play').addEventListener('click', e=>{
  playing = !playing; playT = 0;
  e.target.textContent = playing ? '❚❚ Pause' : '▶ Play';
});
function tickAnim(){
  if(!animFrames) return;
  playT += 1;
  if(playT % 6 === 0){
    let k = (+document.getElementById('frame').value + 1) % animFrames.length;
    setFrame(k);
  }
}

// ---------------------------------------------------------------- legend + stepper
function buildLegend(S){
  const items = [['Input (curve)',COL.curve]];
  if (S.reduce.mode==='collapse') items.push(['Contracted',COL.contracted],['Skeleton',COL.skelNode]);
  else items.push(['Adjacency',COL.edge]);
  if (S.reduce.pruned_edges && S.reduce.pruned_edges.length) items.push(['Pruned shortcut',COL.shortcut]);
  items.push(['Interior',COL.interior],['Tip',COL.tip],['Branch point',COL.branch],['Ground truth',COL.truth]);
  const el = document.getElementById('legend'); el.innerHTML='';
  items.forEach(([t,c])=>{ const d=document.createElement('div');
    const s=document.createElement('span'); s.className='sw';
    s.style.background='#'+c.toString(16).padStart(6,'0');
    d.append(s, document.createTextNode(t)); el.appendChild(d); });
}

let steps = [];
function buildStepper(S){
  const collapse = S.reduce.mode==='collapse';
  steps = [];
  steps.push({ name:'Input', layers:['input','truth'] });
  if (collapse){
    steps.push({ name:'Contraction', layers:['input','contraction'] });
    steps.push({ name:'Skeleton', layers:['skeleton','shortcuts'] });
  } else {
    steps.push({ name:'Adjacency', layers:['adjacency','skeleton','shortcuts'] });
  }
  if (S.consolidate && S.consolidate.merged_edges.length)
    steps.push({ name:'Consolidate', layers: collapse?['skeleton','merged']:['adjacency','merged'] });
  steps.push({ name:'Degrees', layers:['degrees','branch'] });
  steps.push({ name:'Segments', layers:['segments','branch','truth'] });

  const el = document.getElementById('stepper'); el.innerHTML='';
  steps.forEach((st,i)=>{ const b=document.createElement('div'); b.className='step'; b.textContent=`${i+1}. ${st.name}`;
    b.addEventListener('click',()=>gotoStep(i)); el.appendChild(b); });
  gotoStep(steps.length-1); // land on final result
}
function gotoStep(i){
  LAYER_DEFS.forEach(([n])=>setLayer(n,false));
  steps[i].layers.forEach(n=>setLayer(n,true));
  applyVisibility();
  document.querySelectorAll('.step').forEach((e,j)=>e.classList.toggle('active', j===i));
}

// ---------------------------------------------------------------- controls (schema-driven)
let DATASETS = [], CFG_GROUPS = [];
const genState = {}, cfgState = {};

function ctrl(container, spec, state, onchange){
  const wrap = document.createElement('div'); wrap.className='group';
  if (spec.type==='enum'){
    const l=document.createElement('label'); l.className='row';
    l.innerHTML=`<span>${spec.label}</span>`;
    const sel=document.createElement('select');
    spec.options.forEach(o=>{ const opt=document.createElement('option'); opt.value=o; opt.textContent=o; sel.appendChild(opt); });
    sel.value = state[spec.name] ?? spec.default; sel.style.gridColumn='1 / span 2';
    const l2=document.createElement('label'); l2.className='row'; l2.append(document.createTextNode(spec.label));
    sel.addEventListener('change',()=>{ state[spec.name]=sel.value; onchange(); });
    wrap.innerHTML=`<div style="color:var(--muted);margin:6px 0 2px">${spec.label}</div>`;
    wrap.appendChild(sel);
  } else if (spec.type==='bool'){
    const l=document.createElement('label'); l.className='row';
    const nm=document.createElement('span'); nm.textContent=spec.label;
    const cb=document.createElement('input'); cb.type='checkbox';
    cb.checked = (state[spec.name] ?? spec.default) ? true : false;
    cb.style.justifySelf='end'; cb.style.width='auto';
    cb.addEventListener('change',()=>{ state[spec.name]=cb.checked; onchange(); });
    l.append(nm, cb);
    wrap.append(l);
  } else {
    const isInt = spec.type==='int';
    const l=document.createElement('label'); l.className='row';
    const nm=document.createElement('span'); nm.textContent=spec.label;
    const val=document.createElement('span'); val.className='val';
    const r=document.createElement('input'); r.type='range';
    r.min=spec.min; r.max=spec.max; r.step=spec.step; r.value=state[spec.name] ?? spec.default;
    r.style.gridColumn='1 / span 2';
    val.textContent = (+r.value).toString();
    l.append(nm,val);
    r.addEventListener('input',()=>{ const v=isInt?Math.round(+r.value):+r.value;
      state[spec.name]=v; val.textContent=v.toString(); onchange(); });
    wrap.append(l, r);
  }
  container.appendChild(wrap);
}

function buildGenParams(){
  const ds = DATASETS.find(d=>d.key===genState.__dataset);
  const box = document.getElementById('gen-params'); box.innerHTML='';
  for(const k of Object.keys(genState)) if(k!=='__dataset') delete genState[k];
  ds.params.forEach(p=>{ genState[p.name]=p.default;
    ctrl(box, p, genState, scheduleRun);
    const field = box.children[box.children.length-1].querySelector('input,select');
    if(field) field.dataset.gen=p.name;
  });
}

function applyRecommended(ds){
  Object.entries(ds.recommended_config||{}).forEach(([k,v])=>{
    cfgState[k]=v;
    const inp = document.querySelector(`[data-cfg="${k}"]`);
    if(inp){ inp.value=v; const sib=inp.parentElement.querySelector('.val'); if(sib) sib.textContent=v; }
  });
}

function buildConfigParams(){
  const box = document.getElementById('config-params'); box.innerHTML='';
  CFG_GROUPS.forEach(grp=>{
    const h=document.createElement('div'); h.style.cssText='color:var(--muted);font-size:11px;margin:10px 0 2px';
    h.textContent=grp.group; box.appendChild(h);
    grp.params.forEach(p=>{
      cfgState[p.name] = p.default;
      // build control and tag it so applyRecommended can update it
      const before = box.children.length;
      ctrl(box, p, cfgState, scheduleRun);
      const added = box.children[box.children.length-1];
      const field = added.querySelector('input,select'); if(field) field.dataset.cfg=p.name;
    });
  });
}

// ---------------------------------------------------------------- run
let runTimer=null;
function scheduleRun(){ if(!document.getElementById('autorun').checked) return;
  clearTimeout(runTimer); runTimer=setTimeout(run, 220); }

async function run(){
  const status=document.getElementById('status');
  status.textContent='running…'; status.classList.remove('err');
  const gen={}; Object.entries(genState).forEach(([k,v])=>{ if(k!=='__dataset') gen[k]=v; });
  const body={ dataset: genState.__dataset, gen_params: gen, config: {...cfgState},
    animate: document.getElementById('animate').checked };
  try{
    const r = await fetch('/api/pipeline',{ method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body) });
    const data = await r.json();
    if(data.error){ status.textContent=data.error; status.classList.add('err'); console.error(data.traceback); return; }
    rebuild(data);
    status.textContent = `${data.stages.input.n} pts • ${data.stages.effective_mode}`;
  }catch(e){ status.textContent='request failed'; status.classList.add('err'); console.error(e); }
}

document.getElementById('run').addEventListener('click', run);
document.getElementById('animate').addEventListener('change', scheduleRun);
document.getElementById('reseed').addEventListener('click', ()=>{
  if('seed' in genState){
    genState.seed = (genState.seed + 1) % 1000;
    const inp = document.querySelector('#gen-params [data-gen="seed"]');
    if(inp) inp.value = genState.seed;
    const val = inp?.closest('.group')?.querySelector('.val');
    if(val) val.textContent = genState.seed;
  }
  run();
});

// ---------------------------------------------------------------- pulse controls
[['pulse-speed','speed'],['pulse-spawn','spawnRate'],['pulse-clone','cloneProb'],
 ['pulse-reflect','reflectProb'],['pulse-intensity','intensity'],
 ['pulse-falloff','falloff'],['pulse-max','maxAgents']].forEach(([id,key])=>{
  const el=document.getElementById(id), v=document.getElementById(id+'-v');
  const sync=()=>{ pulse[key]=+el.value; if(v) v.textContent=el.value; };
  el.addEventListener('input', sync); sync();
});
document.getElementById('pulse-on').addEventListener('change', e=>{ pulse.on=e.target.checked; pulseSync(); });
document.getElementById('pulse-lights').addEventListener('change', e=>{ pulse.showLights=e.target.checked; });
document.getElementById('pulse-rand').addEventListener('change', e=>{ pulse.randomize=e.target.checked; });
document.getElementById('pulse-color').addEventListener('input', e=>{ pulse.color=parseInt(e.target.value.slice(1),16); });

// ---------------------------------------------------------------- boot
async function boot(){
  const [dsr, cfr] = await Promise.all([
    fetch('/api/datasets').then(r=>r.json()),
    fetch('/api/config-schema').then(r=>r.json()),
  ]);
  DATASETS = dsr.datasets; CFG_GROUPS = cfr.groups;
  const sel=document.getElementById('dataset');
  let group=null;
  DATASETS.forEach(d=>{
    if(d.category!==group){ group=d.category;
      const og=document.createElement('optgroup'); og.label=group; og.id='og-'+group; sel.appendChild(og); }
    const opt=document.createElement('option'); opt.value=d.key; opt.textContent=d.label;
    sel.querySelector('#og-'+d.category).appendChild(opt);
  });
  buildConfigParams();
  genState.__dataset = DATASETS[0].key;
  sel.value = genState.__dataset;
  buildGenParams();
  applyRecommended(DATASETS[0]);
  sel.addEventListener('change',()=>{
    genState.__dataset=sel.value; buildGenParams();
    const ds=DATASETS.find(d=>d.key===sel.value); applyRecommended(ds); run();
  });
  await run();
}
boot();
</script>
